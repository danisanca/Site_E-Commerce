<div class="category-wrapper text-center">
  <div class="circle-card position-relative mx-auto">
    <img class="category-image" [src]="category.imageUrl" alt="{{category.name}}">
    
    <div class="overlay-buttons d-flex justify-content-center align-items-center">
      <button (click)="goProducts()" class="btn-Visualizar btn">Visualizar</button>
    </div>
  </div>
  
  <p class="category-name mt-2 fw-bold">{{ category.name }}</p>
</div>
